<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>GMPX — Indian IPO Intelligence</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    setTimeout(function () {
      try {
        var vw = window.innerWidth;
        var out = { vw: vw, docW: document.documentElement.scrollWidth, bodyW: document.body.scrollWidth, wide: [] };
        var els = document.querySelectorAll('*');
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          var r = el.getBoundingClientRect();
          if (r.width > vw + 1 || r.right > vw + 1) {
            var cls = (el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className) || '';
            out.wide.push(el.tagName + '|' + String(cls).slice(0, 120) + '|w=' + Math.round(r.width) + '|L=' + Math.round(r.left) + '|R=' + Math.round(r.right));
          }
        }
        out.wide = out.wide.slice(0, 40);
        document.title = 'DBG ' + JSON.stringify(out);
      } catch (e) {
        document.title = 'DBG ERR ' + e.message;
      }
    }, 9000);
  </script>
</body>

</html>
